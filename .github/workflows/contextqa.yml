name: Run ContextQA Test Plan
on:
  workflow_dispatch:

jobs:
  test:
    name: ContextQA Test Plan
    runs-on: ubuntu-latest
    steps:
      - name: Install ContextQA MCP client
        run: |
          pip install uv
          git clone https://github.com/indivatools/cqa-mcp.git /tmp/cqa-mcp
          cd /tmp/cqa-mcp && uv sync

      - name: Execute plan and gate on result
        env:
          CONTEXTQA_USERNAME: ${{ secrets.CONTEXTQA_USERNAME }}
          CONTEXTQA_PASSWORD: ${{ secrets.CONTEXTQA_PASS }}
        run: |
          cd /tmp/cqa-mcp
          uv run python -c "
          import os, sys, time
          sys.path.insert(0, '.')
          from app.contextqa_client import ContextQAClient

          client = ContextQAClient(
              username=os.environ['CONTEXTQA_USERNAME'],
              password=os.environ['CONTEXTQA_PASSWORD'])

          run = client.execute_test_plan(test_plan_id=${{ vars.CONTEXTQA_PLAN_ID }})
          execution_id = run['id'] if 'id' in run else run['saveTestPlanResult'][0]['id']
          print(f'Execution started: {execution_id}')

          for attempt in range(60):
              time.sleep(30)
              s = client.get_test_plan_execution_status(execution_id=execution_id)
              status = s.get('status')
              print(f\"Attempt {attempt+1}: status={status} passed={s.get('passedCount')} failed={s.get('failedCount')} total={s.get('totalCount')}\")
              if status != 'STATUS_IN_PROGRESS':
                  ok = s.get('failedCount', 1) == 0 and s.get('abortedCount', 1) == 0 and s.get('totalCount', 0) > 0
                  print('PASSED' if ok else 'FAILED')
                  sys.exit(0 if ok else 1)

          print('Timeout: did not complete in 30 minutes.')
          sys.exit(1)
          "
